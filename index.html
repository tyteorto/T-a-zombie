
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Sniper</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#15191d;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:7px;align-items:center;justify-content:space-between;pointer-events:none}
.info{background:#111c;padding:8px 10px;border-radius:9px;font-size:13px}
button{border:0;border-radius:10px;background:#263b31;color:white;font-weight:bold;padding:12px}
#shopBtn{pointer-events:auto;background:#b47a20}
#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
#movePad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:4px}
.move{background:#17252dcc;border:1px solid #71817b99;font-size:22px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;gap:8px;align-items:end}
#fire{background:#a52b23;width:76px;height:76px;border-radius:50%;font-size:17px}
#scope{background:#344c69}
#shop{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;touch-action:pan-y}
#shopPanel{background:#202b29;width:min(390px,100%);max-height:85dvh;overflow:auto;border:1px solid #63766c;border-radius:15px;padding:15px;touch-action:pan-y}
.shoprow{display:flex;justify-content:space-between;align-items:center;background:#34413d;padding:11px;margin:8px 0;border-radius:9px;gap:8px}
.shoprow button{background:#b27b27;white-space:nowrap}
#close{float:right;background:#92352c}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="info">🪙 <span id="money">0</span></div>
 <div class="info">☠️ <span id="kills">0</span></div>
 <div class="info" id="weaponName">Súng cơ bản</div>
 <button id="shopBtn">SHOP</button>
</div>

<div id="controls">
 <div id="movePad">
  <button class="move" id="up">▲</button>
  <button class="move" id="left">◀</button>
  <button class="move" id="down">▼</button>
  <button class="move" id="right">▶</button>
 </div>
 <div id="actions">
  <button id="scope">NGẮM</button>
  <button id="fire">BẮN</button>
 </div>
</div>

<div id="shop">
 <div id="shopPanel">
  <button id="close">✕</button>
  <h2>🔫 CỬA HÀNG SÚNG</h2>
  <div id="weapons"></div>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,D;
function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=canvas.width=innerWidth*D;
 H=canvas.height=innerHeight*D;
}
resize();
addEventListener("resize",resize);

let money=0,kills=0,weapon=0,scoped=false;
let px=0,pz=0,yaw=0,pitch=0,recoil=0;
let pressed=new Set();
let zombies=[];
const guns=[
 ["Súng cơ bản",0],
 ["Pistol",200],
 ["SMG",500],
 ["Rifle",1000],
 ["Sniper",5000],
 ["Golden Gun",10000],
 ["Dark Sniper",50000],
 ["Legendary",100000]
];
const owned=new Set([0]);

function hud(){
 document.getElementById("money").textContent=money;
 document.getElementById("kills").textContent=kills;
 document.getElementById("weaponName").textContent=guns[weapon][0];
}
function spawn(){
 zombies.push({
  x:(Math.random()-.5)*15,
  z:12+Math.random()*35
 });
}
for(let i=0;i<9;i++)spawn();

function project(x,z){
 let dx=x-px,dz=z-pz;
 let s=Math.sin(yaw),c=Math.cos(yaw);
 let cx=dx*c-dz*s;
 let cz=dx*s+dz*c;
 if(cz<1)return null;
 let focal=H*.85;
 let horizon=H*.44+pitch*H*.35;
 return {
  x:W/2+cx*focal/cz,
  y:horizon+focal*1.35/cz,
  scale:focal/cz,
  depth:cz
 };
}

function sky(){
 let g=ctx.createLinearGradient(0,0,0,H*.65);
 g.addColorStop(0,"#607d91");
 g.addColorStop(1,"#d0b99a");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);
}

function city(){
 for(let i=0;i<15;i++){
  let x=i*W/14;
  let h=H*(.10+(i*17%9)/100);
  ctx.fillStyle=i%2?"#59656a":"#737b79";
  ctx.fillRect(x,H*.43-h,W/17,h);
  ctx.fillStyle="#d6c79c";
  for(let j=0;j<3;j++)
   ctx.fillRect(x+W*.008+j*W*.018,H*.43-h+15*D,W*.008,9*D);
 }
}

function roof(){
 ctx.fillStyle="#777b79";
 ctx.fillRect(0,H*.54,W,H*.46);

 // Gạch lát bê tông, không có tia nối
 ctx.strokeStyle="#555c59";
 ctx.lineWidth=1.2*D;
 for(let y=H*.57;y<H*1.2;y+=H*.055){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
 for(let x=-W;x<W*2;x+=W*.10){
  ctx.beginPath();ctx.moveTo(x,H*.55);ctx.lineTo(x,H);ctx.stroke();
 }

 // Lan can sân thượng
 ctx.fillStyle="#414c4b";
 ctx.fillRect(0,H*.48,W,H*.025);
 ctx.fillRect(0,H*.50,W,H*.012);
 for(let x=0;x<W;x+=W*.09)
  ctx.fillRect(x,H*.45,W*.008,H*.055);
}

function drawZombie(z){
 let p=project(z.x,z.z);
 if(!p||p.x<-100||p.x>W+100||p.y>H*1.2)return;
 let size=Math.max(5,p.scale*.55);
 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.scale(size,size);

 ctx.fillStyle="#343b32";
 ctx.fillRect(-.28,-.2,.19,.5);
 ctx.fillRect(.10,-.2,.19,.5);

 ctx.fillStyle="#597b48";
 ctx.fillRect(-.38,-1.15,.76,1);

 ctx.fillStyle="#688c52";
 ctx.fillRect(-.65,-1.05,.25,.75);
 ctx.fillRect(.40,-1.05,.25,.75);

 ctx.fillStyle="#86a45e";
 ctx.beginPath();
 ctx.arc(0,-1.42,.38,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#d82020";
 ctx.fillRect(-.19,-1.5,.11,.08);
 ctx.fillRect(.10,-1.5,.11,.08);
 ctx.restore();
}

function gun(){
 let scale=Math.min(1,Math.max(.65,H/700));
 let x=W*.72,y=H-8*D+recoil;
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale*D,scale*D);

 ctx.fillStyle="#c28c69";
 ctx.fillRect(-40,-45,30,55);
 ctx.fillRect(30,-42,28,48);

 ctx.fillStyle=weapon===5?"#d6ad35":weapon===6?"#24242e":"#30363b";
 ctx.fillRect(-18,-65,65,22);
 ctx.fillRect(5,-92,13,30);
 ctx.fillStyle="#111";
 ctx.fillRect(8,-112,8,22);
 ctx.fillStyle="#777";
 ctx.fillRect(10,-113,4,16);
 ctx.fillStyle="#202326";
 ctx.fillRect(0,-48,18,25);
 ctx.restore();
}

function crosshair(){
 let x=W/2,y=H*.48;
 let s=(scoped?12:9)*D;
 ctx.strokeStyle="#fff";
 ctx.lineWidth=2*D;
 ctx.beginPath();
 ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);
 ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);
 ctx.stroke();
 ctx.fillStyle="#e33";
 ctx.fillRect(x-1.5*D,y-1.5*D,3*D,3*D);
}

function draw(){
 sky();
 city();
 roof();
 [...zombies].sort((a,b)=>b.z-a.z).forEach(drawZombie);
 gun();

 if(scoped){
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.arc(W/2,H*.48,H*.28,0,Math.PI*2,true);
  ctx.fill("evenodd");
  ctx.strokeStyle="#111";
  ctx.lineWidth=8*D;
  ctx.beginPath();
  ctx.arc(W/2,H*.48,H*.28,0,Math.PI*2);
  ctx.stroke();
 }
 crosshair();
}

function movement(){
 let speed=.12;
 let dx=0,dz=0;
 if(pressed.has("up"))dz+=speed;
 if(pressed.has("down"))dz-=speed;
 if(pressed.has("left"))dx-=speed;
 if(pressed.has("right"))dx+=speed;
 px+=dx*Math.cos(yaw)+dz*Math.sin(yaw);
 pz+=dz*Math.cos(yaw)-dx*Math.sin(yaw);
}

let last=0;
function loop(t){
 let dt=Math.min(40,t-last);
 last=t;
 movement();
 recoil*=.75;
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function shoot(){
 recoil=-8*D;
 let target=null,best=Infinity;
 for(let z of zombies){
  let p=project(z.x,z.z);
  if(!p)continue;
  let d=Math.hypot(p.x-W/2,p.y-H*.48);
  if(d<best){best=d;target=z;}
 }
 if(target&&best<Math.max(35*D,H*.075)){
  zombies.splice(zombies.indexOf(target),1);
  kills++;
  money+=100;
  spawn();
  hud();
 }
 try{
  let a=new AudioContext();
  let o=a.createOscillator();
  let g=a.createGain();
  o.connect(g);g.connect(a.destination);
  o.frequency.value=100;
  o.type="sawtooth";
  g.gain.setValueAtTime(.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);
  o.start();o.stop(a.currentTime+.12);
 }catch(e){}
}

document.getElementById("fire").onclick=shoot;
document.getElementById("scope").onclick=()=>{
 scoped=!scoped;
 document.getElementById("scope").style.background=scoped?"#a46a20":"#344c69";
};

for(let id of ["up","down","left","right"]){
 let b=document.getElementById(id);
 b.onpointerdown=e=>{
  e.preventDefault();
  pressed.add(id);
 };
 b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{
  pressed.delete(id);
 };
}

let dragging=false,lastX=0,lastY=0;
canvas.addEventListener("pointerdown",e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});
canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;
 let dx=e.clientX-lastX;
 let dy=e.clientY-lastY;

 // Đã đảo chiều vuốt cho đúng
 yaw-=dx*.006;
 pitch=Math.max(-.6,Math.min(.6,pitch-dy*.003));

 lastX=e.clientX;
 lastY=e.clientY;
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

function renderShop(){
 let box=document.getElementById("weapons");
 box.innerHTML="";
 guns.forEach((g,i)=>{
  let row=document.createElement("div");
  row.className="shoprow";
  let label=document.createElement("span");
  label.textContent=g[0]+" — "+g[1]+" xu";
  let btn=document.createElement("button");
  btn.textContent=owned.has(i)?(weapon===i?"ĐANG DÙNG":"CHỌN"):"MUA";
  btn.onclick=()=>{
   if(owned.has(i)){
    weapon=i;hud();renderShop();return;
   }
   if(money>=g[1]){
    money-=g[1];
    owned.add(i);
    weapon=i;
    hud();renderShop();
   }else{
    btn.textContent="THIẾU XU";
   }
  };
  row.append(label,btn);
  box.append(row);
 });
}
document.getElementById("shopBtn").onclick=()=>{
 renderShop();
 document.getElementById("shop").style.display="flex";
};
document.getElementById("close").onclick=()=>{
 document.getElementById("shop").style.display="none";
};
hud();
</script>
</body>
</html>
