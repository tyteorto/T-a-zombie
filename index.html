
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Sniper</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
button{color:white;background:#263b50;border:2px solid #aaa;border-radius:12px;font-weight:bold;touch-action:none;user-select:none}
#hud{position:fixed;top:8px;left:7px;right:7px;display:flex;justify-content:space-between;align-items:center;gap:4px;pointer-events:none}
.info{background:#101d;padding:8px;border-radius:8px;font-size:12px}
#shopBtn{pointer-events:auto;padding:9px}
#controls{position:fixed;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#movePad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:3px;pointer-events:auto}
.moveBtn{font-size:22px;padding:0;background:#263b50dd}
#actions{display:flex;gap:6px;pointer-events:auto;align-items:end}
#fire{background:#a22;font-size:17px;padding:17px 13px}
#scope{background:#245078;padding:14px}
#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#111c;padding:8px;border-radius:8px;pointer-events:none;font-size:12px;white-space:nowrap}
#shop{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:12px}
.panel{background:#202831;border:2px solid #aaa;border-radius:14px;padding:14px;width:min(370px,95vw);max-height:85vh;overflow:auto}
.shophead{display:flex;justify-content:space-between;align-items:center}
#close{background:#a22;font-size:20px;padding:7px 14px}
.weapon{display:flex;justify-content:space-between;align-items:center;background:#36414c;padding:10px;margin:7px 0;border-radius:8px;gap:5px}
.weapon button{padding:8px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="info">💰 <span id="money">0</span></div>
 <div class="info">🧟 <span id="kills">0</span></div>
 <div class="info">🔫 <span id="weaponName">Súng cơ bản</span></div>
 <button id="shopBtn">🏪 SHOP</button>
</div>

<div id="message">Vuốt màn hình để xoay camera!</div>

<div id="controls">
 <div id="movePad">
  <div></div>
  <button class="moveBtn" id="forward">⬆️</button>
  <div></div>
  <button class="moveBtn" id="left">⬅️</button>
  <button class="moveBtn" id="backward">⬇️</button>
  <button class="moveBtn" id="right">➡️</button>
 </div>
 <div id="actions">
  <button id="scope">🔭 NGẮM</button>
  <button id="fire">BẮN 🔥</button>
 </div>
</div>

<div id="shop">
 <div class="panel">
  <div class="shophead">
   <h2>🔫 CỬA HÀNG SÚNG</h2>
   <button id="close">✕</button>
  </div>
  <p>Tiền: <b id="shopMoney">0</b> xu</p>
  <div id="weapons"></div>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,D;
function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);
resize();

// TRẠNG THÁI GAME
let money=0,kills=0;
let px=0,pz=0;
let cameraYaw=0,cameraPitch=0;
let scoped=false;
let recoil=0,flash=0,lastShot=0;

let gun=0;
const guns=[
 ["Súng cơ bản",0,"#777"],
 ["Pistol",200,"#aaa"],
 ["SMG",500,"#555"],
 ["Rifle",1000,"#795b36"],
 ["Sniper",5000,"#343e49"],
 ["Golden Gun",10000,"#d5a900"],
 ["Dark Sniper",50000,"#542b77"],
 ["Legendary",100000,"#d42b35"]
];
let owned=[true,false,false,false,false,false,false,false];

let zombies=[];
function spawn(){
 zombies.push({
  x:(Math.random()-.5)*28,
  z:10+Math.random()*30,
  alive:true,
  size:.8+Math.random()*.4
 });
}
for(let i=0;i<18;i++)spawn();

// CHUYỂN TỌA ĐỘ THẾ GIỚI THÀNH GÓC NHÌN CAMERA
function project(x,z){
 let ox=x-px;
 let oz=z-pz;
 let c=Math.cos(cameraYaw);
 let s=Math.sin(cameraYaw);

 let cx=ox*c-oz*s;
 let cz=ox*s+oz*c;

 if(cz<1)return null;

 let scale=H/(cz+4);
 return {
  x:W/2+cx*scale*.75,
  y:H*.53-cz*scale*.24+cameraPitch*H*.7,
  scale:scale,
  depth:cz
 };
}

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);
 ctx.fill();
}

// VẼ CẢNH
function drawWorld(){
 let sky=ctx.createLinearGradient(0,0,0,H*.7);
 sky.addColorStop(0,"#172b40");
 sky.addColorStop(.65,"#647b80");
 sky.addColorStop(1,"#d39a6b");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 circle(W*.8,H*.17,Math.min(W,H)*.05,"#f0c58a");

 // Các tòa nhà
 for(let i=-7;i<=7;i++){
  for(let side of [-1,1]){
   let wx=i*7+side*13;
   let wz=23+Math.abs(i%3)*3;
   let p=project(wx,wz);
   if(!p)continue;

   let bw=p.scale*7;
   let bh=p.scale*(8+(Math.abs(i)%4)*2);

   rect(p.x-bw/2,p.y-bh,bw,bh,"#34434c");

   for(let a=0;a<3;a++){
    for(let b=0;b<3;b++){
     rect(p.x-bw/2+5+b*bw/4,p.y-bh+8+a*bh/4,4,6,"#c6a66b");
    }
   }
  }
 }

 // Mặt đất
 let ground=ctx.createLinearGradient(0,H*.45,0,H);
 ground.addColorStop(0,"#626454");
 ground.addColorStop(1,"#252d30");
 ctx.fillStyle=ground;
 ctx.fillRect(0,H*.45,W,H*.55);

 // Các vạch đường phối cảnh
 ctx.strokeStyle="#888";
 ctx.lineWidth=2;
 for(let x=-30;x<=30;x+=5){
  let p=project(x,20);
  if(!p)continue;
  ctx.beginPath();
  ctx.moveTo(W/2+(p.x-W/2)*.05,H*.55);
  ctx.lineTo(p.x,H);
  ctx.stroke();
 }

 for(let z=4;z<35;z+=3){
  let p=project(0,z);
  if(!p)continue;
  ctx.beginPath();
  ctx.moveTo(0,p.y);
  ctx.lineTo(W,p.y);
  ctx.stroke();
 }
}

// VẼ ZOMBIE
function drawZombie(z){
 if(!z.alive)return;
 let p=project(z.x,z.z);
 if(!p)return;

 let s=p.scale*z.size*.65;
 if(s<2)return;

 ctx.save();
 ctx.translate(p.x,p.y);

 circle(0,s*.75,s*.28,"#252b27");

 rect(-s*.22,s*.25,s*.16,s*.55,"#344b38");
 rect(s*.06,s*.25,s*.16,s*.55,"#344b38");

 rect(-s*.32,-s*.2,s*.64,s*.55,"#526e4d");

 ctx.strokeStyle="#617b51";
 ctx.lineWidth=s*.12;

 ctx.beginPath();
 ctx.moveTo(-s*.25,-s*.05);
 ctx.lineTo(-s*.5,s*.4);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(s*.25,-s*.05);
 ctx.lineTo(s*.5,s*.4);
 ctx.stroke();

 circle(0,-s*.38,s*.28,"#788b5c");
 circle(-s*.1,-s*.4,s*.04,"#f22");
 circle(s*.1,-s*.4,s*.04,"#f22");
 rect(-s*.1,-s*.25,s*.2,s*.04,"#241");

 ctx.restore();
}

// TAY VÀ SÚNG
function drawGun(){
 let x=W/2;
 let color=guns[gun][2];

 ctx.fillStyle="#bd8765";

 // Tay trái
 ctx.beginPath();
 ctx.moveTo(x-120,H+20);
 ctx.lineTo(x-65,H-90+recoil);
 ctx.lineTo(x-20,H-55);
 ctx.lineTo(x-30,H+20);
 ctx.fill();

 // Tay phải
 ctx.beginPath();
 ctx.moveTo(x+120,H+20);
 ctx.lineTo(x+65,H-90+recoil);
 ctx.lineTo(x+20,H-55);
 ctx.lineTo(x+30,H+20);
 ctx.fill();

 // Thân súng
 rect(x-34,H-95+recoil,68,130,color);
 rect(x-12,H-190+recoil,24,110,color);
 rect(x-25,H-145+recoil,50,15,"#16191d");
 rect(x-14,H-158+recoil,28,13,"#56616a");
 rect(x-45,H-70+recoil,90,30,color);

 if(flash>0){
  circle(x,H-205+recoil,18,"#ffc044");
  flash--;
 }
 recoil*=.7;
}

// ỐNG NGẮM
function drawScope(){
 if(!scoped)return;

 ctx.fillStyle="#000c";
 ctx.beginPath();
 ctx.rect(0,0,W,H);
 ctx.arc(W/2,H*.43,Math.min(W,H)*.36,0,Math.PI*2,true);
 ctx.fill("evenodd");

 ctx.strokeStyle="#eee";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(W/2,H*.43,Math.min(W,H)*.36,0,Math.PI*2);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(W/2-45,H*.43);
 ctx.lineTo(W/2+45,H*.43);
 ctx.moveTo(W/2,H*.43-45);
 ctx.lineTo(W/2,H*.43+45);
 ctx.stroke();
}

// VÒNG LẶP VẼ
function draw(){
 ctx.clearRect(0,0,W,H);
 drawWorld();

 zombies.sort((a,b)=>b.z-a.z);
 zombies.forEach(drawZombie);

 drawGun();
 drawScope();

 requestAnimationFrame(draw);
}
draw();

// DI CHUYỂN BẰNG 4 NÚT
const directions={
 forward:[0,1],
 backward:[0,-1],
 left:[-1,0],
 right:[1,0]
};
let pressed=new Set();
let dx=0,dz=0;

function updateDirection(){
 dx=0;dz=0;

 pressed.forEach(id=>{
  dx+=directions[id][0];
  dz+=directions[id][1];
 });

 let len=Math.hypot(dx,dz);
 if(len>1){dx/=len;dz/=len}
}

Object.keys(directions).forEach(id=>{
 let btn=document.getElementById(id);

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  btn.setPointerCapture(e.pointerId);
  pressed.add(id);
  updateDirection();
 });

 function stop(){
  pressed.delete(id);
  updateDirection();
 }

 btn.addEventListener("pointerup",stop);
 btn.addEventListener("pointercancel",stop);
 btn.addEventListener("lostpointercapture",stop);
});

// DI CHUYỂN THEO HƯỚNG CAMERA
function movement(){
 let c=Math.cos(cameraYaw);
 let s=Math.sin(cameraYaw);

 px+=(dx*c-dz*s)*.13;
 pz+=(dx*s+dz*c)*.13;

 // Giới hạn vị trí
 px=Math.max(-45,Math.min(45,px));
 pz=Math.max(-20,Math.min(45,pz));
}
setInterval(movement,30);

// VUỐT ĐỂ XOAY CAMERA
let lookId=null;
let lastX=0,lastY=0;

canvas.addEventListener("pointerdown",e=>{
 lookId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
});

canvas.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;

 let mx=e.clientX-lastX;
 let my=e.clientY-lastY;

 cameraYaw+=mx*.006;
 cameraPitch+=my*.004;
 cameraPitch=Math.max(-.5,Math.min(.5,cameraPitch));

 lastX=e.clientX;
 lastY=e.clientY;
});

function stopLook(){
 lookId=null;
}
canvas.addEventListener("pointerup",stopLook);
canvas.addEventListener("pointercancel",stopLook);

// BẮN
function shoot(){
 if(Date.now()-lastShot<250)return;
 lastShot=Date.now();

 recoil=18;
 flash=3;

 let best=null;
 let dist=Infinity;

 zombies.forEach(z=>{
  if(!z.alive)return;
  let p=project(z.x,z.z);
  if(!p)return;

  let d=Math.hypot(p.x-W/2,p.y-H*.43);
  if(d<dist){
   dist=d;
   best=z;
  }
 });

 let range=Math.min(W,H)*(scoped?.13:.065);

 if(best&&dist<range){
  best.alive=false;
  money+=100;
  kills++;
  setTimeout(spawn,700);

  document.getElementById("message").textContent="+100 xu! Hạ gục zombie!";
 }else{
  document.getElementById("message").textContent="Trượt mục tiêu!";
 }

 updateHUD();
 sound();
}

document.getElementById("fire").onclick=shoot;

// ÂM THANH
function sound(){
 try{
  let a=new AudioContext();
  let o=a.createOscillator();
  let g=a.createGain();

  o.type="sawtooth";
  o.frequency.value=90;
  g.gain.setValueAtTime(.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);

  o.connect(g);
  g.connect(a.destination);
  o.start();
  o.stop(a.currentTime+.13);
 }catch(e){}
}

// NGẮM
document.getElementById("scope").onclick=()=>{
 scoped=!scoped;
 document.getElementById("scope").textContent=scoped?"❌ BỎ NGẮM":"🔭 NGẮM";
};

// SHOP
document.getElementById("shopBtn").onclick=()=>{
 document.getElementById("shop").style.display="flex";
 renderShop();
};

document.getElementById("close").onclick=()=>{
 document.getElementById("shop").style.display="none";
};

function renderShop(){
 document.getElementById("shopMoney").textContent=money;
 let box=document.getElementById("weapons");
 box.innerHTML="";

 guns.forEach((g,i)=>{
  let row=document.createElement("div");
  row.className="weapon";

  let label=document.createElement("span");
  label.textContent="🔫 "+g[0]+" ("+g[1]+" xu)";

  let b=document.createElement("button");
  b.textContent=owned[i]?(gun===i?"ĐANG DÙNG":"CHỌN"):"MUA";

  b.onclick=()=>{
   if(owned[i]){
    gun=i;
   }else if(money>=g[1]){
    money-=g[1];
    owned[i]=true;
    gun=i;
   }else{
    alert("Bạn chưa đủ xu!");
    return;
   }

   updateHUD();
   renderShop();
  };

  row.append(label,b);
  box.append(row);
 });
}

function updateHUD(){
 document.getElementById("money").textContent=money;
 document.getElementById("kills").textContent=kills;
 document.getElementById("weaponName").textContent=guns[gun][0];
}
</script>
</body>
</html>
