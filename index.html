
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zombie Sniper</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.info{background:#111b;padding:9px 12px;border:1px solid #777;border-radius:9px;font-weight:bold}
button{border:1px solid #aaa;background:#222e;color:white;border-radius:10px;padding:12px;font-weight:bold;font-size:15px}
#controls{position:fixed;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.group{display:flex;gap:8px;pointer-events:auto}
#fire{background:#a52222;font-size:19px;padding:20px}
#scope{background:#234b79}
#shop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px}
.panel{background:#20252c;border:2px solid #aaa;border-radius:15px;padding:18px;width:min(360px,95vw);max-height:85vh;overflow:auto}
.weapon{display:flex;justify-content:space-between;align-items:center;padding:10px;margin:7px 0;background:#343b45;border-radius:8px}
.weapon button{padding:8px}
#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#111c;padding:8px 12px;border-radius:8px;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="info">💰 <span id="money">0</span> xu</div>
 <div class="info">🧟 <span id="kills">0</span> hạ gục</div>
 <div class="info">🔫 <span id="weaponName">Súng cơ bản</span></div>
</div>

<div id="message">Tiêu diệt zombie để kiếm xu!</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
  <button id="shopBtn">🏪 Shop</button>
 </div>
 <div class="group">
  <button id="scope">🔭 NGẮM</button>
  <button id="fire">BẮN 🔥</button>
 </div>
</div>

<div id="shop">
 <div class="panel">
  <h2>🔫 CỬA HÀNG SÚNG</h2>
  <p>Tiền của bạn: <b id="shopMoney">0</b> xu</p>
  <div id="weapons"></div>
  <button onclick="closeShop()" style="width:100%;margin-top:10px">ĐÓNG</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0,dpr=1;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth; H=innerHeight;
 canvas.width=W*dpr; canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let money=0,kills=0;
let playerX=0,aimX=.5,aimY=.42;
let scoped=false;
let currentGun=0;
let gameRunning=true;
let recoil=0;
let flash=0;
let lastShot=0;

const guns=[
 {name:"Súng cơ bản",price:0,color:"#777",power:1},
 {name:"Pistol",price:200,color:"#aaa",power:1},
 {name:"SMG",price:500,color:"#555",power:1},
 {name:"Rifle",price:1000,color:"#795b36",power:1},
 {name:"Sniper",price:5000,color:"#343e49",power:1},
 {name:"Golden Gun",price:10000,color:"#d5a900",power:1},
 {name:"Dark Sniper",price:50000,color:"#542b77",power:1},
 {name:"Legendary",price:100000,color:"#d42b35",power:1}
];
let owned=[true,false,false,false,false,false,false,false];

let zombies=[];
function spawnZombie(){
 zombies.push({
  x:Math.random(),
  y:.45+Math.random()*.25,
  size:.65+Math.random()*.5,
  alive:true,
  phase:Math.random()*6,
  speed:.000015+Math.random()*.00002
 });
}
for(let i=0;i<12;i++)spawnZombie();

function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,c){
 ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H*.65);
 g.addColorStop(0,"#15283e");
 g.addColorStop(.65,"#647c83");
 g.addColorStop(1,"#d39a6b");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Mặt trời
 circle(W*.78,H*.18,Math.min(W,H)*.055,"#e9c18a");

 // Thành phố phía xa
 for(let i=0;i<18;i++){
  let bw=W/12;
  let x=(i*W/12-playerX*35)% (W+bw);
  let bh=H*(.13+(i*37%20)/100);
  rect(x,H*.57-bh,bw+3,bh,"#263642");
  for(let yy=H*.57-bh+12;yy<H*.57-5;yy+=17){
   for(let xx=x+8;xx<x+bw-5;xx+=15){
    rect(xx,yy,5,7,"#d5b77b");
   }
  }
 }
 // Mặt đất xa
 rect(0,H*.57,W,H*.43,"#55594e");
 // Tường sân thượng
 rect(0,H*.64,W,H*.1,"#555c5c");
 rect(0,H*.64,W,5,"#a5a6a0");
 // Sàn
 let floor=ctx.createLinearGradient(0,H*.72,0,H);
 floor.addColorStop(0,"#55595a");
 floor.addColorStop(1,"#20282d");
 ctx.fillStyle=floor;ctx.fillRect(0,H*.72,W,H*.28);
 // Vạch sàn
 ctx.strokeStyle="#777";ctx.lineWidth=2;
 for(let i=0;i<8;i++){
  let x=i*W/7-playerX*20;
  ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.25,H*.72);
  ctx.lineTo(x,H);ctx.stroke();
 }
}

function drawZombie(z){
 if(!z.alive)return;
 let x=z.x*W-playerX*30;
 let y=z.y*H;
 let s=Math.min(W,H)*.12*z.size;
 let walk=Math.sin(Date.now()*.006+z.phase)*s*.08;
 ctx.save();
 ctx.translate(x,y);
 // Bóng
 circle(0,s*.95,s*.35,"#252b27");
 // Chân
 rect(-s*.25,s*.42+walk,s*.19,s*.47,"#33483a");
 rect(s*.07,s*.42-walk,s*.19,s*.47,"#33483a");
 // Thân
 ctx.fillStyle="#536d4c";
 ctx.fillRect(-s*.36,-s*.05,s*.72,s*.62);
 // Tay
 ctx.strokeStyle="#617b51";ctx.lineWidth=s*.17;
 ctx.beginPath();ctx.moveTo(-s*.3,s*.08);ctx.lineTo(-s*.57,s*.48+walk);ctx.stroke();
 ctx.beginPath();ctx.moveTo(s*.3,s*.08);ctx.lineTo(s*.55,s*.45-walk);ctx.stroke();
 // Đầu
 circle(0,-s*.28,s*.31,"#788b5c");
 // Mắt
 circle(-s*.12,-s*.3,s*.045,"#e33");
 circle(s*.12,-s*.3,s*.045,"#e33");
 // Miệng
 rect(-s*.11,-s*.16,s*.22,s*.045,"#30221c");
 ctx.restore();
}

function drawGun(){
 let x=W*.5;
 let y=H+recoil;
 let gun=guns[currentGun];
 // Hai tay
 ctx.fillStyle="#bd8765";
 ctx.beginPath();
 ctx.moveTo(x-110,H+30);ctx.lineTo(x-65,H-85);ctx.lineTo(x-15,H-60);
 ctx.lineTo(x-30,H+30);ctx.fill();
 ctx.beginPath();
 ctx.moveTo(x+110,H+30);ctx.lineTo(x+65,H-85);ctx.lineTo(x+15,H-60);
 ctx.lineTo(x+30,H+30);ctx.fill();
 // Thân súng
 ctx.fillStyle=gun.color;
 ctx.beginPath();
 ctx.moveTo(x-35,H-100+recoil);
 ctx.lineTo(x+35,H-100+recoil);
 ctx.lineTo(x+25,H+40);
 ctx.lineTo(x-25,H+40);
 ctx.fill();
 // Nòng súng
 rect(x-12,H-190+recoil,24,110,gun.color);
 rect(x-18,H-190+recoil,36,13,"#16191d");
 // Ống ngắm
 rect(x-25,H-145+recoil,50,15,"#171b20");
 rect(x-14,H-157+recoil,28,12,"#56616a");
 // Báng
 rect(x-45,H-70+recoil,90,35,gun.color);
 // Chi tiết
 rect(x-5,H-130+recoil,10,40,"#17191c");
 if(flash>0){
  circle(x,H-205+recoil,18+Math.random()*10,"#ffbd43");
  flash--;
 }
}

function drawScope(){
 if(!scoped)return;
 ctx.fillStyle="#0009";
 ctx.beginPath();ctx.rect(0,0,W,H);
 ctx.arc(aimX*W,aimY*H,Math.min(W,H)*.35,0,Math.PI*2,true);
 ctx.fill("evenodd");
 ctx.strokeStyle="#111";ctx.lineWidth=7;
 ctx.beginPath();ctx.arc(aimX*W,aimY*H,Math.min(W,H)*.35,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle="#e9e9e9";ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(aimX*W-35,aimY*H);ctx.lineTo(aimX*W+35,aimY*H);
 ctx.moveTo(aimX*W,aimY*H-35);ctx.lineTo(aimX*W,aimY*H+35);
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawSky();
 zombies.forEach(drawZombie);
 drawGun();
 drawScope();
 // Tâm ngắm
 if(!scoped){
  ctx.strokeStyle="#fff";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(aimX*W,aimY*H,9,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(aimX*W-17,aimY*H);ctx.lineTo(aimX*W+17,aimY*H);
  ctx.moveTo(aimX*W,aimY*H-17);ctx.lineTo(aimX*W,aimY*H+17);
  ctx.stroke();
 }
 recoil*=.7;
 requestAnimationFrame(draw);
}
draw();

// Ngắm bằng cách chạm/kéo trên màn hình
canvas.addEventListener("pointerdown",e=>{
 aimX=e.clientX/W;aimY=e.clientY/H;
});
canvas.addEventListener("pointermove",e=>{
 if(e.buttons||e.pointerType==="touch"){
  aimX=e.clientX/W;aimY=e.clientY/H;
 }
});

function shoot(){
 if(Date.now()-lastShot<250)return;
 lastShot=Date.now();
 recoil=18;flash=3;
 sound();
 let target=null,best=Infinity;
 zombies.forEach(z=>{
  if(!z.alive)return;
  let x=z.x*W-playerX*30;
  let y=z.y*H;
  let d=Math.hypot(x-aimX*W,y-aimY*H);
  if(d<best){best=d;target=z;}
 });
 let range=scoped?Math.min(W,H)*.19:Math.min(W,H)*.10;
 if(target&&best<range){
  target.alive=false;
  money+=100;kills++;
  updateHUD();
  document.getElementById("message").textContent="+100 xu! Hạ gục zombie!";
  setTimeout(()=>document.getElementById("message").textContent="Tiếp tục tiêu diệt zombie!",900);
  setTimeout(spawnZombie,900);
 }else{
  document.getElementById("message").textContent="Trượt rồi! Hãy ngắm chính xác hơn.";
 }
}
document.getElementById("fire").onclick=shoot;

function sound(){
 try{
  let a=new AudioContext();
  let o=a.createOscillator(),g=a.createGain();
  o.type="sawtooth";o.frequency.value=95;
  g.gain.setValueAtTime(.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);
  o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+.13);
 }catch(e){}
}

document.getElementById("scope").onclick=()=>{
 scoped=!scoped;
 document.getElementById("scope").textContent=scoped?"❌ BỎ NGẮM":"🔭 NGẮM";
};

function move(dir){playerX+=dir*.15;playerX=Math.max(-5,Math.min(5,playerX));}
document.getElementById("left").onpointerdown=()=>move(-1);
document.getElementById("right").onpointerdown=()=>move(1);

document.getElementById("shopBtn").onclick=openShop;
function openShop(){
 document.getElementById("shop").style.display="flex";
 renderShop();
}
function closeShop(){
 document.getElementById("shop").style.display="none";
}
function renderShop(){
 document.getElementById("shopMoney").textContent=money;
 document.getElementById("weapons").innerHTML="";
 guns.forEach((g,i)=>{
  let div=document.createElement("div");
  div.className="weapon";
  let name=document.createElement("b");
  name.textContent="🔫 "+g.name+" - "+g.price+" xu";
  let btn=document.createElement("button");
  btn.textContent=owned[i]?(currentGun===i?"ĐANG DÙNG":"CHỌN"):"MUA";
  btn.onclick=()=>{
   if(owned[i]){currentGun=i;updateHUD();renderShop();}
   else if(money>=g.price){
    money-=g.price;owned[i]=true;currentGun=i;
    updateHUD();renderShop();
   }else alert("Bạn chưa đủ xu!");
  };
  div.append(name,btn);
  document.getElementById("weapons").appendChild(div);
 });
}
function updateHUD(){
 document.getElementById("money").textContent=money;
 document.getElementById("kills").textContent=kills;
 document.getElementById("weaponName").textContent=guns[currentGun].name;
}
</script>
</body>
</html>
